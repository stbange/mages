schema: spec-driven

context: |
  Mages is an original turn-based fantasy strategy game for 1-4 players in the
  style of late-1980s 8-bit home computer games (C64 palette, 320x200 screen).
  It must not reuse names, art, maps or text from any existing commercial game.
  Code is C11 with SDL3 and must build for Windows, Linux and Web (Emscripten).
  All game rules, rendering and audio synthesis live in a platform-free core
  library; only a thin platform layer talks to SDL.
  Core line coverage must stay at or above 95%; every behaviour change needs
  unit tests and, where it affects play, an automated game script test.

